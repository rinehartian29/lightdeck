function micSetStatus(s){ MIC.status=s; const n=$('#micstat'); if (n) n.textContent=s; const b=$('#micbtn'); if (b) b.textContent = MIC.stream ? 'Stop listening' : 'Start listening'; }
async function micStart(){
  if (MIC.stream || !micAllowedHere()) return;
  const pc = S.musicSrc==='pc';
  try {
    micSetStatus(pc ? 'Pick what to share: for the Spotify app choose "Entire screen" and turn on "Also share system audio"; for the web player pick its tab and turn on tab audio.' : 'Asking for the microphone…');
    MIC.ctx = new (window.AudioContext||window.webkitAudioContext)();          // created during the tap
    if (MIC.ctx.state==='suspended') await MIC.ctx.resume();
    const clean = {echoCancellation:false, noiseSuppression:false, autoGainControl:false};
    if (pc) {
      // Chrome only shares audio together with a screen or tab, so a video track comes along; it isn't used.
      MIC.stream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:{...clean, suppressLocalAudioPlayback:false},
        systemAudio:'include', selfBrowserSurface:'exclude', surfaceSwitching:'include'});
      if (!MIC.stream.getAudioTracks().length) {
        MIC.stream.getTracks().forEach(t=>t.stop()); MIC.stream = null;
        throw {name:'NoAudio'};
      }
      MIC.stream.getVideoTracks().forEach(t=>{ t.enabled = false; });
      MIC.stream.getAudioTracks()[0].addEventListener('ended', () => { micStop(); micSetStatus('Sharing stopped. Tap Start listening to pick the audio again.'); });
    } else {
      MIC.stream = await navigator.mediaDevices.getUserMedia({audio:clean});
    }
    MIC.src = S.musicSrc;
    MIC.an = MIC.ctx.createAnalyser(); MIC.an.fftSize = 1024; MIC.buf = new Float32Array(MIC.an.fftSize);
    MIC.ctx.createMediaStreamSource(new MediaStream(MIC.stream.getAudioTracks())).connect(MIC.an);
    MIC.beats = 0; MIC.peak = 0.02; MIC.loud = 0; MIC.sendAt = 0; MIC.pendingBeat = false;
    MIC.timer = setInterval(() => {                     // ~40 checks a second
      if (!MIC.an) return;
      if (MIC.ctx.state==='suspended') MIC.ctx.resume().catch(()=>{});
      MIC.an.getFloatTimeDomainData(MIC.buf);
      let e=0; for (let i=0;i<MIC.buf.length;i++) e+=MIC.buf[i]*MIC.buf[i];
      const rms = Math.sqrt(e/MIC.buf.length), now = performance.now();
      // loudness 0..1, relative to the recent loudest moment (so it adapts to how loud the room is)
      MIC.peak = Math.max(rms, MIC.peak*0.9985, 0.004);
      const gain = 0.6 + S.sens/100*0.8;                // Sensitivity: how quickly it reaches full brightness
      const target = Math.min(1, rms/MIC.peak*gain);
      MIC.loud += (target - MIC.loud) * (target > MIC.loud ? 0.5 : 0.08);   // rises fast, settles slowly
      // beats (for stepping to the next color)
      MIC.avg = MIC.avg ? MIC.avg*0.97 + rms*0.03 : rms;

      if (rms > MIC.avg*k && rms > 0.008 && now-MIC.last > 300) { MIC.last = now; MIC.beats++; MIC.pendingBeat = true; beat.last = now/1000; beat.idx++; }
      // send the loudness ~8 times a second (and whether a beat happened)
      if (now - MIC.sendAt > 125) {
        MIC.sendAt = now;
        hubApi('/api/beat',{loud:Math.round(MIC.loud*100), beat:MIC.pendingBeat?1:0}).catch(()=>{});
        MIC.pendingBeat = false;
        micSetStatus(`Listening · loudness ${Math.round(MIC.loud*100)}% · ${MIC.beats} beats`);
      }
    }, 25);
    micSetStatus('Listening · play some music');
  } catch(e) {
    micStop();
    micSetStatus(pc
      ? (e && e.name==='NoAudio' ? 'No sound was shared. Tap Start listening again and turn on "Also share system audio" (or tab audio) in the share window.'
        : e && e.name==='NotAllowedError' ? 'Sharing was cancelled. Tap Start listening to try again.'
        : 'Couldn\'t capture the laptop\'s audio ('+((e&&e.name)||'error')+'). The hub keeps its own tempo meanwhile.')
      : e && e.name==='NotAllowedError'
      ? 'The microphone is blocked for this site. Allow it in your browser\'s site settings (the icon next to the address), then tap Start listening.'
      : 'Couldn\'t start the microphone ('+((e&&e.name)||'error')+'). The hub keeps its own tempo meanwhile.');
  }
}
function micStop(){
  clearInterval(MIC.timer);
  if (MIC.stream) MIC.stream.getTracks().forEach(t=>t.stop());
  try { if (MIC.ctx) MIC.ctx.close(); } catch(e) {}
  Object.assign(MIC, {stream:null, ctx:null, an:null, buf:null, avg:0, timer:0, src:''});
  micSetStatus(micAllowedHere() ? 'Not listening' : '');
}
async function micUpdate(){
  if (MIC.stream && (!micWanted() || MIC.src!==S.musicSrc)) micStop();

  else if (micWanted() && S.musicSrc==='phone' && !MIC.stream && !MIC.status.startsWith('Asking') && navigator.permissions) {
    try { const p = await navigator.permissions.query({name:'microphone'}); if (p.state==='granted') micStart(); } catch(e) {}
  }
}

    <div class="err" id="lerr" role="alert"></div>
    <button class="btn primary" type="submit">${creating?'Create password':'Unlock'}</button>
    <span class="hint">${creating?'Don\'t reuse an important password: on school Wi-Fi, the hub\'s own page isn\'t encrypted.':'Forgot it? Hold BOOT on the hub for 2–8 s to reset the password from its setup hotspot.'}</span>
    <span class="demo" style="align-self:flex-start">demo: stored in this browser only</span>
  </form>`;
  L.hidden=false;
  L.querySelectorAll('[data-peek]').forEach(b=>b.onclick=()=>{ const i=$('#'+b.dataset.peek); i.type=i.type==='password'?'text':'password'; b.textContent=i.type==='password'?'Show':'Hide'; });
  $('#lp1').focus();
  $('#lockform').onsubmit = async e => {
    e.preventDefault(); const p1=$('#lp1').value, err=$('#lerr');
    if (creating) {
      if (p1.length<8) { err.textContent='Use at least 8 characters.'; return; }
      if (p1!==$('#lp2').value) { err.textContent='The two passwords don\'t match. Type them again.'; return; }
      LS.set('ld-pass', await passHash(p1));
    } else if (await passHash(p1)!==LS.get('ld-pass')) {
      err.textContent='That password isn\'t right. Try again.'; $('#lp1').select(); return;
    }
    LS.set('ld-session','1'); L.hidden=true; L.innerHTML=''; boot(); toast(creating?'Password set. This device is signed in.':'Signed in');
  };
}
let booted=false, ticking=false;
function boot(){
  if (booted) { render(); return; }
  booted=true; render();
  if (!ticking) { ticking=true; requestAnimationFrame(tick); }
  // away from home: check every 2.5 s instead of every second (the relay's free plan has a monthly data limit)
  if (HUB.live) { hubPoll(); HUB.timers.push(setInterval(hubPoll, HUB.remote?2500:1000), setInterval(hubSync, HUB.remote?300:150), setInterval(micUpdate, 1000)); }
}
(async () => {
  HUB.live = await detectHub();
  if (!HUB.live) {
    // the online copy: a "Set up a device" link (#r=...) stores the relay login on this device
    const m = location.hash.match(/^#r=([A-Za-z0-9_\-]+)/);
    if (m) { try { const j=JSON.parse(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))); if (j.h && j.id) LS.set('ld-remote', JSON.stringify(j)); } catch(e) {}
             history.replaceState(null, '', location.pathname + location.search); }
    RM.cfg = remoteCfg();
    if (location.protocol==='https:' && (RM.cfg || /github\.io$/.test(location.hostname))) { HUB.live = true; HUB.remote = true; }
  }
  if (HUB.remote) {
    document.body.classList.add('live');
    const rk = LS.get('ld-rkey');
    if (!RM.cfg || !rk) return showLock();
    try { await remoteConnect(); RM.key = await importAesKey(unb64(rk)); HUB.status = await hubApi('/api/status'); await hubLoad(); boot(); }
    catch(e) { if (e && e.timeout) { LS.del('ld-rkey'); RM.key=null; } showLock(); }
  } else if (HUB.live) {
    document.body.classList.add('live');
    HUB.token = LS.get('ld_token') || '';
    if (!HUB.token) return showLock();
    try { await hubLoad(); boot(); } catch(e) { showLock(); }
  } else {
    if (LS.get('ld-session')==='1' && LS.get('ld-pass')) boot(); else showLock();
  }
})();
</script>
