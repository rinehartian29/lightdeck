<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111317"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Light Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=VT323&display=swap">
<style>
/* Layout: phone-first control surface. Header (status + theme switch), room switcher, one view per tab, bottom nav.
   Three skins re-tint the same tokens; each skin also gets its own Lights view layout. */
:root{
  --bg:#111317; --panel:#1a1c21; --panel2:#23262c; --line:#2d3139; --fg:#ece8df; --mut:#8f949d;
  --accent:#ffb547; --accent2:#ff6b3d; --good:#4fd18b; --warn:#f5b942; --bad:#ff5c5c;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --radius:14px; --label-track:.08em;
  color-scheme:dark;
}
body[data-skin="map"]{
  --bg:#0c1721; --panel:#122230; --panel2:#17303f; --line:#27445a; --fg:#e3eef5; --mut:#87a3b6;
  --accent:#7cd3ff; --accent2:#ffd27c; --display:'JetBrains Mono',ui-monospace,monospace; --radius:10px; --label-track:.04em;
}
body[data-skin="neon"]{
  --bg:#0a0517; --panel:#120927; --panel2:#1b0f39; --line:#3c2273; --fg:#f6ecff; --mut:#a88fcf;
  --accent:#ff3ef0; --accent2:#29f0ff; --display:'VT323',ui-monospace,monospace; --radius:4px; --label-track:.12em;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;transition:background .3s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body[data-skin="neon"]::after{content:"";position:fixed;inset:auto 0 0;height:45vh;z-index:-1;pointer-events:none;
  background:linear-gradient(transparent,rgba(255,62,240,.08)),
  repeating-linear-gradient(90deg,rgba(41,240,255,.16) 0 1px,transparent 1px 48px),
  repeating-linear-gradient(0deg,rgba(255,62,240,.18) 0 1px,transparent 1px 32px);
  transform:perspective(320px) rotateX(58deg);transform-origin:bottom;animation:grid 3s linear infinite}
@keyframes grid{to{background-position:0 0,0 0,0 32px}}
@media (prefers-reduced-motion:reduce){body[data-skin="neon"]::after{animation:none}}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:14px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;line-height:1}
body[data-skin="neon"] .brand h1{font-size:34px;color:var(--accent);text-shadow:0 0 8px var(--accent),0 0 22px rgba(255,62,240,.6)}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mut);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
body[data-skin="neon"] .seg,body[data-skin="neon"] .seg button{border-radius:2px}

main{padding-top:18px;display:flex;flex-direction:column;gap:18px}
.view{display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.02em;text-wrap:balance}
body[data-skin="neon"] .sec-h h2{font-size:28px;color:var(--accent2);text-shadow:0 0 10px rgba(41,240,255,.6)}
.hint{color:var(--mut);font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
body[data-skin="neon"] .card{box-shadow:0 0 0 1px rgba(255,62,240,.15),0 0 24px rgba(255,62,240,.08) inset}
.label{font-family:var(--display);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:var(--label-track);color:var(--mut)}
body[data-skin="neon"] .label{font-size:17px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--fg);min-height:36px;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel2))}
body[data-skin="neon"] .chip{border-radius:2px}
.chip .sw{width:12px;height:12px;border-radius:50%}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 14px;font-weight:600;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#14110b}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
body[data-skin="neon"] .btn.primary{color:#12021a;box-shadow:0 0 14px var(--accent)}
.btn.small{min-height:32px;padding:5px 10px;font-size:12.5px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0}
input[type=time],input[type=text],input[type=number],select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px;font-variant-numeric:tabular-nums;max-width:100%}
input[type=text]{width:100%;font-size:13px}
input.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.switch{position:relative;width:46px;height:26px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:color-mix(in srgb,var(--accent) 35%,var(--panel2));border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--accent)}
.roombar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.roombar .chip{flex:none}
.segbar{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:1px;height:10px;width:100%;border-radius:3px;overflow:hidden;background:#000}
.segbar i{display:block;background:#222}

/* ---------- MIXER skin (flat lights, no glow) ---------- */
.desk{background:linear-gradient(180deg,#1c1e23,#15171b);border:1px solid var(--line);border-radius:18px;padding:14px 10px 16px;display:flex;flex-direction:column;gap:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.stripscroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.strips{display:grid;gap:6px}
.strip{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 4px;border-radius:12px;background:#121418;border:1px solid #24272e;min-width:0}
.strip.master{background:#17191d}
.strip .ch{font-family:var(--mono);font-size:10.5px;color:var(--mut);letter-spacing:.06em}
.strip .segbar{width:40px;height:8px}
.lampdot{width:34px;height:34px;border-radius:50%;border:1px solid #2c3038;padding:0;background:rgba(var(--c),calc(.15 + .85*var(--lv)))}
.fader{position:relative;width:52px;height:250px;touch-action:none;cursor:ns-resize;--v:.5}
.fader::before{content:"";position:absolute;inset:14px 4px;background:repeating-linear-gradient(0deg,#3a3e47 0 1px,transparent 1px 10%);mask:linear-gradient(90deg,#000 0 22%,transparent 22% 78%,#000 78%)}
.fader .track{position:absolute;left:50%;top:14px;bottom:14px;width:6px;margin-left:-3px;background:#07080a;border-radius:3px;overflow:hidden}
.fader .fill{position:absolute;left:0;right:0;bottom:0;height:calc(var(--v)*100%);background:rgb(var(--c));opacity:calc(.35 + .65*var(--lv))}
.fader .cap{position:absolute;left:50%;width:42px;height:28px;margin-left:-21px;bottom:calc(var(--v)*(100% - 28px));background:linear-gradient(#454a53,#2a2d33 55%,#1f2227);border:1px solid #555b65;border-radius:5px;box-shadow:0 5px 10px rgba(0,0,0,.55)}
.fader .cap::after{content:"";position:absolute;left:5px;right:5px;top:13px;height:2px;background:#e9e6df;border-radius:1px}
.strip .lvl{font-family:var(--mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.strip .nm{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.mute{width:44px;height:26px;border-radius:5px;border:1px solid #3a3e47;background:#1d2025;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--mut)}
.mute[aria-pressed="true"]{background:var(--accent);color:#14110b;border-color:var(--accent)}
.sel{width:44px;height:22px;border-radius:5px;border:1px solid #3a3e47;background:#1d2025;font-family:var(--mono);font-size:10px;color:var(--mut)}
.sel[aria-pressed="true"]{border-color:#7cd3ff;color:#7cd3ff}
.deckfoot{display:grid;grid-template-columns:auto auto 1fr;gap:18px;align-items:center;padding:0 6px}
@media (max-width:520px){.deckfoot{grid-template-columns:auto auto}.deckfoot .pads{grid-column:1 / -1}}
.knobwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.knob{width:84px;height:84px;border-radius:50%;position:relative;touch-action:none;cursor:grab;border:0;padding:0;
  background:conic-gradient(from 0deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.knob::before{content:"";position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4a4e57,#23262b 70%);box-shadow:0 4px 10px rgba(0,0,0,.6)}
.knob .ptr{position:absolute;left:50%;top:50%;width:4px;height:30px;margin-left:-2px;margin-top:-30px;transform-origin:50% 100%;border-radius:2px;background:#fff}
.knob .cc{position:absolute;inset:30px;border-radius:50%}
.knobnote{font-size:11px;color:var(--mut);text-align:center;max-width:96px}
.pads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-width:0}
.pad{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid #3a3e47;background:#1d2025;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.05em;padding:4px;min-width:0}
.pad .pl{width:60%;height:4px;border-radius:2px}
.pad:active{transform:translateY(1px)}

/* ---------- MAP skin ---------- */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:14px}
@media (max-width:760px){.mapwrap{grid-template-columns:minmax(0,1fr)}}
.blue{background:#0a1520;border:1px solid var(--line);border-radius:var(--radius);padding:10px;position:relative;
  background-image:linear-gradient(rgba(124,211,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(124,211,255,.06) 1px,transparent 1px);background-size:20px 20px}
.blue svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.blue .wall{fill:none;stroke:#cfe7f5;stroke-width:4}
.blue .furn{fill:rgba(124,211,255,.08);stroke:#7cd3ff;stroke-width:1.2}
.blue .furn-t{fill:#9cc3da;font-family:var(--mono);font-size:9px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.blue .dim{fill:#5f87a0;font-family:var(--mono);font-size:9px;text-anchor:middle}
.blue .item{cursor:pointer}
.blue.editing .item{cursor:move}
.blue .item.picked .furn{stroke:#ffd27c;stroke-width:2;stroke-dasharray:4 3}
.blue .lampcore{stroke:#e3eef5;stroke-width:1.5}
.blue .item.picked .lampcore,.blue .item.focus .lampcore{stroke:#ffd27c;stroke-width:3}
.edit-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.maptag{position:absolute;top:14px;left:16px;font-family:var(--mono);font-size:11px;color:#5f87a0;pointer-events:none}

/* ---------- NEON skin ---------- */
.neongrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.ncard{position:relative;background:rgba(18,9,39,.85);border:2px solid rgba(var(--c),calc(.25 + .75*var(--lv)));border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 0 calc(30px*var(--lv)) rgba(var(--c),.45),inset 0 0 calc(24px*var(--lv)) rgba(var(--c),.25)}
.ncard .nn{font-family:var(--display);font-size:30px;line-height:1;color:rgb(var(--c));text-shadow:0 0 10px rgba(var(--c),.8)}
.ncard .np{font-family:var(--display);font-size:54px;line-height:.9;font-variant-numeric:tabular-nums}
.ncard .bars{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;height:16px}
.ncard .bars i{background:rgba(var(--c),.15)}
.ncard .bars i.on{background:rgb(var(--c));box-shadow:0 0 6px rgb(var(--c))}
.ncard .meta{font-family:var(--display);font-size:17px;color:var(--mut);letter-spacing:.08em}
.nbtn{font-family:var(--display);font-size:20px;letter-spacing:.1em;border:2px solid var(--accent2);background:transparent;color:var(--accent2);border-radius:2px;padding:4px 12px;text-shadow:0 0 6px var(--accent2)}
.nbtn[aria-pressed="false"]{border-color:var(--mut);color:var(--mut);text-shadow:none}

.ledit{display:flex;flex-direction:column;gap:12px}
.swbtn{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);flex:none}
.bigname{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1}

/* scenes */
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.scene{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);min-height:120px;display:flex;flex-direction:column}
.sapply{border:0;background:none;color:inherit;text-align:left;display:flex;flex-direction:column;gap:10px;padding:12px;width:100%;flex:1;border-radius:inherit}
.smore{position:absolute;bottom:8px;right:8px;width:32px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:700;line-height:1;padding:0}
.smenu{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}
.srow{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.srow.excluded b{color:var(--mut)}
.srow .ctl{display:grid;grid-template-columns:auto auto minmax(0,1fr) 44px;gap:10px;align-items:center}
.sgrad{height:36px;border-radius:10px}
.smenu .chips{gap:6px}
/* drag to reorder: hold (touch) or click-drag (mouse) */
[data-sort]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.drag-src{opacity:.3}
.drag-ghost{position:fixed;margin:0;pointer-events:none;z-index:40;box-shadow:0 14px 34px rgba(0,0,0,.55);transform:scale(1.03);opacity:.95}
.handle{cursor:grab;touch-action:none;border:0;background:none;color:var(--mut);font-size:18px;line-height:1;padding:6px 4px;min-height:36px}
.strip .ch.handle{cursor:grab;touch-action:none;padding:4px 6px;border-radius:5px;font-size:10.5px;min-height:0}
.strip .ch.handle:hover{background:#1d2025}
.scene .grad{height:46px;border-radius:8px}
.scene .sn{font-weight:700;font-size:15px}
.scene .badge{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff}
.scene.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

/* modes */
.fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.fx{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:92px}
.fx .pv{height:20px;border-radius:5px}
.fx[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fx b{font-size:14px}.fx span{font-size:12px;color:var(--mut)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mcard{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:10px}
.mcard.running{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mcard .segbar{height:22px;border-radius:6px}
.mcard .mt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mcard .mt b{font-size:15px}
.newmode{border:1px dashed var(--line);background:transparent;border-radius:var(--radius);min-height:120px;color:var(--mut);font-weight:600}
.meter{display:flex;align-items:flex-end;gap:3px;height:48px}
.meter i{flex:1;background:var(--accent);border-radius:2px;min-height:2px;opacity:.85}

/* mode editor (WiZ-style) */
.pal{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.palc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mut)}
.palc .b{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);position:relative}
.palc .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:12px;line-height:1;padding:0;color:var(--fg)}
.palc .add{width:48px;height:48px;border-radius:50%;border:1px dashed var(--mut);background:transparent;font-size:22px;color:var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600}
.tile[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel2))}
.tile svg{width:56px;height:22px}
.prevbox{display:flex;align-items:center;gap:14px;background:#08090b;border:1px solid var(--line);border-radius:12px;padding:14px}
.prevbox .segbar{height:18px;flex:1}
.prevbox .bulb{width:30px;height:30px;border-radius:50%;flex:none;background:rgba(var(--c),calc(.12 + .88*var(--lv)))}

/* clock */
.clockprev{background:#08090b;border:1px solid var(--line);border-radius:var(--radius);padding:22px 12px;display:flex;justify-content:center}
.dchips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dchip{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600}
.dchip i{width:28px;height:28px;border-radius:8px;display:block}

/* settings */
.skins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.skinc{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;background:var(--panel2);text-align:left}
.skinc[aria-pressed="true"]{border-color:var(--accent)}
.skinc .pv{height:70px}
.skinc div.t{padding:8px 10px;font-weight:700;font-size:13px}
.dev{display:grid;grid-template-columns:auto minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);background:var(--panel)}
.dev:last-child{border-bottom:0}
@media (max-width:640px){.dev{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr)}.dev .main{grid-column:2 / -1}.dev .acts{grid-column:2 / -1;justify-content:flex-start}}
.dev .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

<script>
/* ===================== data ===================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
// What each kind of light can do. grad = can show several colors along its length.
const TYPES = {
  clock: {label:'LED clock',           grad:true,  segs:0,  wiz:false},
  rgbic: {label:'WiZ RGBIC strip',     grad:true,  segs:20, wiz:true},
  bulb:  {label:'WiZ bulb',            grad:false, segs:0,  wiz:true},
  esp:   {label:'ESP32 LED strip',     grad:true,  segs:30, wiz:false},
};
let LIGHTS = [
  {id:'clock', name:'Clock',        room:'dorm', type:'clock', ip:'10.73.25.41',  mac:'A0:B7:65:2F:11:C8', on:true,  bri:55, c:[255,60,0]},
  {id:'desk',  name:'Desk lamp',    room:'dorm', type:'rgbic', ip:'10.73.24.94',  mac:'CC:40:85:66:9D:F4', on:true,  bri:70, c:[120,70,255]},
  {id:'floor', name:'Floor lamp',   room:'dorm', type:'bulb',  ip:'10.73.25.179', mac:'CC:40:85:DF:85:38', on:true,  bri:40, c:[255,150,70]},
  {id:'bed',   name:'Bedside lamp', room:'dorm', type:'bulb',  ip:'10.73.24.100', mac:'CC:40:85:E0:78:66', on:false, bri:30, c:[255,110,60]},
];
const byId = id => LIGHTS.find(l => l.id === id);
const isGrad = l => TYPES[l.type].grad;
const short = n => n.replace(/ lamp$/,'');

const FURN_NAMES = {bed:'Bed', desk:'Desk', dresser:'Dresser', rug:'Rug', chair:'Chair', shelf:'Shelf', door:'Door', fridge:'Mini fridge', couch:'Couch', tv:'TV'};
const FURN_SIZES = {bed:[3.3,6.6], desk:[4,2], dresser:[3,1.6], rug:[4,3], chair:[1.6,1.6], shelf:[3,1], fridge:[1.7,1.7], door:[3,.5], couch:[6,2.6], tv:[4,.5]};
const DORM_LAYOUT = {w:12, h:14, items:[
  {k:'bed',x:0.3,y:0.3,w:4.5,h:6.6,r:0},{k:'desk',x:7.4,y:0.3,w:4.3,h:2.2,r:0},{k:'dresser',x:8.6,y:6.5,w:3.1,h:1.6,r:90},
  {k:'rug',x:4.6,y:6.0,w:4.0,h:3.0,r:0},{k:'door',x:8.5,y:13.4,w:3.0,h:0.5,r:0}]};

let S = {
  skin:'mixer', tab:'lights', room:'all', sel:'desk', master:100, armed:['desk'],
  colorA:[255,60,0], colorB:[0,200,255],
  fx:null, fxTargets:null, speed:50, musicSrc:'phone', sens:60, activeScene:null,
  rooms:[{id:'dorm', name:'Dorm room'}],
  layouts:{dorm:JSON.parse(JSON.stringify(DORM_LAYOUT))},
  lampPos:{bed:{x:1.0,y:7.6}, desk:{x:9.6,y:1.3}, floor:{x:1.2,y:12.6}, clock:{x:6.2,y:0.6}},
  editing:false, picked:null,
  modes:[
    {id:'m1', name:'Ember', pal:['ff3a3a','ff8a00'], loop:'gradual', grad:'rainbow', speed:40, room:'all', roles:{}},
    {id:'m2', name:'Ocean drift', pal:['0050ff','00e0c8','6a00ff'], loop:'gradual', grad:'flow', speed:35, room:'all', roles:{floor:'c1'}},
    {id:'m3', name:'Night sky', pal:['1a2cff','ffffff'], loop:'pulse', grad:'sparkle', speed:30, room:'all', roles:{bed:'off'}},
    {id:'m4', name:'Comet', pal:['ffd27c','ff2e88'], loop:'jump', grad:'shooting', speed:60, room:'all', roles:{}},
  ],
  presets:[
    {name:'Chill',  L:{clock:[1,40,[255,90,30]], desk:[1,50,[120,60,255]], floor:[1,35,[255,140,60]], bed:[1,25,[255,100,50]]}},
    {name:'Focus',  L:{clock:[1,80,[255,235,220]], desk:[1,95,[255,235,220]], floor:[1,85,[255,225,200]], bed:[0,30,[255,210,160]]}},
    {name:'Movie',  L:{clock:[1,8,[255,40,0]], desk:[1,18,[40,70,255]], floor:[0,20,[255,140,60]], bed:[1,10,[255,120,40]]}},
    {name:'Party',  L:{clock:[1,100,[255,0,200]], desk:[1,100,[0,220,255]], floor:[1,90,[255,0,120]], bed:[1,80,[120,0,255]]}},
    {name:'Sunset', L:{clock:[1,60,[255,70,0]], desk:[1,60,[255,60,120]], floor:[1,55,[255,130,30]], bed:[1,40,[255,90,60]]}},
    {name:'Night',  L:{clock:[1,5,[255,10,0]], desk:[0,10,[255,0,0]], floor:[0,10,[255,0,0]], bed:[1,6,[255,30,0]]}},
  ],
  clock:{speed:128, dc:['ff3c00','ff3c00','00c8ff','00c8ff'], colon:'ffffff', link:true, h24:false, lead:false, blink:true, fx:'solid', trans:'wipe', alarmFx:true},
  sched:{wake:{on:true,time:'07:30',days:[1,2,3,4,5],fade:20}, night:{on:true,from:'21:30',k:2200}, dim:{on:true,from:'23:00',to:'07:00',lvl:10}, sleepEnd:0},
};
const KEY='lightdeck-demo-v2';
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) { Object.assign(S, s.S); LIGHTS = s.L; } } catch(e) {}
S.editing=false; S.picked=null;
if (!S.fxTargets) S.fxTargets = LIGHTS.map(l=>l.id);
// per-light dynamic modes: lightModes[lightId] = modeId. lastMode = the one knobs A/B edit.
if (!S.lightModes) S.lightModes = {};
if (S.fx && S.fx.startsWith('m:')) { const mid=S.fx.slice(2); LIGHTS.forEach(l=>S.lightModes[l.id]=mid); S.lastMode=mid; S.fx=null; }
delete S.modeOnly;
{ const desk=byId('desk'); if (desk && desk.type==='rgbic' && !S.deskSegsMeasured) { desk.segUsed=9; S.deskSegsMeasured=true; } }   // measured Nov 20 2026: exactly 9 segments visible
if (!S.devices) S.devices = [{n:'This browser', me:true}, {n:'Laptop · Chrome', w:'2 days ago'}, {n:'iPad · Safari', w:'last week'}];
if (!S.musicPal) S.musicPal =['ff3ef0','29f0ff','ffd23f'];   // music sync colors (2-6), step one per beat
// Demo: everything in this browser. Live (served by the hub): shared data goes to the hub, per-device prefs stay here.
function save(){
  if (typeof HUB!=='undefined' && HUB.live) { hubSaveDevice(); hubScheduleSave(); return; }
  try { localStorage.setItem(KEY, JSON.stringify({S, L:LIGHTS})); } catch(e) {}
}

const roomLights = r => LIGHTS.filter(l => r==='all' || l.room===r);
const roomName = r => r==='all' ? 'All rooms' : (S.rooms.find(x=>x.id===r)||{name:'?'}).name;
const faderNo = l => { const i = roomLights(l.room).indexOf(l); return i < 4 ? i+1 : 0; };

/* ===================== color helpers ===================== */
const hex2rgb = h => [0,2,4].map(i => parseInt(h.slice(i,i+2),16) || 0);
const rgb2hex = c => c.map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const css = (c,a=1) => `rgba(${c.map(Math.round).join(',')},${a})`;
const mix = (a,b,f) => a.map((v,i)=>v+(b[i]-v)*f);
const frac = x => x - Math.floor(x);
function hsv(h,s=1,v=1){ const f=n=>{const k=(n+h/60)%6; return v-v*s*Math.max(0,Math.min(k,4-k,1));}; return [f(5)*255,f(3)*255,f(1)*255]; }
function toHS(c){ const [r,g,b]=c.map(v=>v/255), mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn; let h=0;
  if(d){ if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4; } return [(h*60+360)%360, mx?d/mx:0]; }
function kelvin(k){ return k<=2400?[255,140,40]:k<=3000?[255,170,90]:k<=4200?[255,210,160]:k<=5500?[255,235,220]:[235,240,255]; }
// smooth white-temperature color, 2200 K (warm yellow) to 6500 K (white), for the whites slider
const KEL_PTS=[[2200,[255,147,44]],[2700,[255,169,87]],[3000,[255,180,107]],[4000,[255,209,163]],[5000,[255,228,206]],[6500,[255,249,253]]];
function kelvinSmooth(k){ for(let i=1;i<KEL_PTS.length;i++){ const [k1,c1]=KEL_PTS[i]; if(k<=k1){ const [k0,c0]=KEL_PTS[i-1]; return mix(c0,c1,(k-k0)/(k1-k0)).map(Math.round); } } return KEL_PTS[KEL_PTS.length-1][1]; }
const noise = t => (Math.sin(t*1.7)+Math.sin(t*3.1+1.3)*.6+Math.sin(t*7.3+.4)*.35)/1.95;
const hash = x => frac(Math.sin(x*12.9898)*43758.5453);

/* ===================== dynamic modes (palette + color-loop + gradient) ===================== */
const LOOPS = [['jump','Jump','Snaps from color to color'],['gradual','Gradual','Blends smoothly between colors'],['pulse','Pulse','Each color fades in and out']];
const GRADS = [['flow','Flow'],['shooting','Shooting star'],['sparkle','Sparkle'],['rainbow','Rainbow']];
const GRAD_ICON = {
  flow:'<defs><linearGradient id="gi1"><stop offset="0" stop-color="#7cd3ff" stop-opacity=".2"/><stop offset="1" stop-color="#ffd23f"/></linearGradient></defs><path d="M2 11 Q30 6 52 9 a3 3 0 0 1 0 5 Q30 16 2 11z" fill="url(#gi1)"/>',
  shooting:'<path d="M4 11 L36 9 L36 13z" fill="#7cd3ff" opacity=".6"/><circle cx="44" cy="11" r="6" fill="#ffd23f"/>',
  sparkle:'<path d="M2 11h52" stroke="#7cd3ff" stroke-width="1.5"/><path d="M12 3l2 8-2 8-2-8zM28 3l2 8-2 8-2-8zM44 3l2 8-2 8-2-8z" fill="#ffd23f"/>',
  rainbow:'<path d="M8 20a20 15 0 0 1 40 0" fill="none" stroke="url(#gi2)" stroke-width="5"/><defs><linearGradient id="gi2"><stop offset="0" stop-color="#ffd23f"/><stop offset=".5" stop-color="#7cf0a0"/><stop offset="1" stop-color="#7cd3ff"/></linearGradient></defs>',
};
const modeById = id => S.modes.find(m=>m.id===id);
const modeOfLight = id => { const mid=S.lightModes[id]; return mid ? modeById(mid) : null; };
const activeModeIds = () => [...new Set(Object.entries(S.lightModes).filter(([id,mid])=>byId(id)&&modeById(mid)).map(([,mid])=>mid))];
// the mode knobs A/B edit: the most recently started one that's still running
const runningMode = () => { const a=activeModeIds(); return a.includes(S.lastMode) ? modeById(S.lastMode) : (a.length ? modeById(a[a.length-1]) : null); };
let draft = null;   // mode open in the editor (previewed live)
const palRgb = m => m.pal.map(hex2rgb);
function palAt(pal, x){ const n=pal.length, y=frac(x)*n, i=Math.floor(y)%n; return mix(pal[i], pal[(i+1)%n], y-Math.floor(y)); }
// color-loop: what a single-color light (or a gradient light with no gradient effect) shows
function loopColor(m, t, offset=0){
  const pal=palRgb(m), n=pal.length, x=t*0.22*(m.speed/50)+offset, i=Math.floor(x)%n, f=frac(x);
  if (m.loop==='jump') return [f>.85 ? mix(pal[i],pal[(i+1)%n],(f-.85)/.15) : pal[i], 1];   // jump, with a quick fade
  if (m.loop==='pulse') return [pal[i], .12+.88*Math.sin(Math.PI*f)];
  return [mix(pal[i],pal[(i+1)%n],f),1];
}
// gradient: color at position p (0..1) along a gradient-capable light
function gradColor(m, p, t, seed=0){
  const pal=palRgb(m), sp=m.speed/50;
  if (!m.grad) return loopColor(m,t,seed*.13);
  if (m.grad==='flow') return [palAt(pal, p*.999 - t*.12*sp), 1];
  if (m.grad==='rainbow') return [hsv((p*360 + t*60*sp)%360), 1];
  if (m.grad==='shooting'){ const head=frac(t*.32*sp+seed*.21), d=frac(head-p), tail=.3;
    return d<tail ? [mix(pal[0], pal[1%pal.length], d/tail), 1-d*2.2] : [pal[1%pal.length], .18]; }
  if (m.grad==='sparkle'){ const base=palAt(pal,p), tt=t*2.5*sp, tick=Math.floor(tt), ph=tt-tick, s=hash(Math.floor(p*40)*7.1 + tick*.37 + seed);
    if (s>.84) { const w=Math.sin(Math.PI*ph); return [mix(base,[255,255,255],.45*w), .45+.55*w]; }   // slow twinkles that fade
    return [base,.45]; }
  return [pal[0],1];
}
// does mode m apply to light l, and how
function modeOut(m, l, i, t, p=.5){
  if (isGrad(l)) return gradColor(m, p, t, i);
  const role = (m.roles||{})[l.id] || 'loop';
  if (role==='off') return [[0,0,0],0];
  if (role.startsWith('c')) { const pal=palRgb(m); return [pal[Math.min(+role.slice(1),pal.length-1)],1]; }
  return loopColor(m, t, i*.0);
}

/* ===================== quick effects (built-in) ===================== */
const FX = [
  {id:null,      name:'Off',          d:'Lights hold their own colors', pv:'linear-gradient(90deg,#555,#888)'},
  {id:'fade',    name:'Color fade',   d:'All lights drift through hues together', pv:'linear-gradient(90deg,#f33,#fc3,#3f6,#3cf,#93f)'},
  {id:'candle',  name:'Candle',       d:'Warm flicker, out of sync per lamp', pv:'linear-gradient(90deg,#ff7a1a,#ffb347,#ff5a00,#ffa23a)'},
  {id:'breathe', name:'Breathe',      d:'Slow pulse, offset lamp to lamp', pv:'linear-gradient(90deg,#222,#7cd3ff,#222)'},
  {id:'music',   name:'Music sync',   d:'Brightness follows the music, colors change on the beat', pv:'repeating-linear-gradient(90deg,#ff3ef0 0 6px,#29f0ff 6px 12px)'},
];
let beat = {env:0, idx:0, last:0};
// music sync color: steps through your palette once per beat; 'offset' spreads lights / positions across it
function musicColor(offset){ const pal=S.musicPal.map(hex2rgb), n=pal.length; return pal[((beat.idx+offset)%n+n)%n]; }
const musicGrad = () => `repeating-linear-gradient(90deg,${S.musicPal.map((h,i)=>`#${h} ${i*8}px ${(i+1)*8}px`).join(',')})`;

/* What light l shows at position p (0..1 along it) right now: [rgb, level 0..1] */
function lightAt(l, i, t, p=.5){
  const lvBase = l.on ? (l.bri/100)*(S.master/100) : 0;
  if (!l.on) return [l.c, 0];
  if (l.wizScene) {                      // the lamp is running one of WiZ's own scenes: preview it
    const w = wizSceneInfo(l.wizScene), pal = w.pal.map(hex2rgb);
    if (!w.dyn) return [pal[0], lvBase];
    if (w.flicker) { const n=noise(t*4+i*9+p*6); return [mix(pal[0], pal[1%pal.length], .5+.5*n), lvBase*(.65+.35*n)]; }
    return [palAt(pal, p*.8 - t*.06 + i*.17), lvBase];
  }
  const m = modeOfLight(l.id);
  if (m) { const o = modeOut(m,l,i,t,p); return [o[0], lvBase*o[1]]; }
  let c=l.c, lv=lvBase;
  if (S.fx && S.fxTargets.includes(l.id)) {
    const sp=S.speed/50;
    if (S.fx==='fade')    c = hsv((t*18*sp)%360);
    if (S.fx==='candle')  { const n=noise(t*sp*1.6+i*9+p*6); c=[255,125+30*n,28]; lv *= .78+.22*n; }   // a calm glow (matches the hub)
    if (S.fx==='breathe') lv *= .22 + .78*(.5+.5*Math.sin(t*sp*1.5 + i*.8));
    if (S.fx==='music')   { c = musicColor(i + Math.floor(p*S.musicPal.length*.999)); lv *= .12 + .88*beat.env; }
  }
  return [c, Math.max(0,Math.min(1,lv))];
}

/* ===================== app shell ===================== */
const TABS = [
  ['lights','Lights','<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.6 1 2.5h6c0-.9.2-1.7 1-2.5A6 6 0 0 0 12 3z"/>'],
  ['scenes','Scenes','<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>'],
  ['modes','Modes','<path d="M4 12c2-6 4-6 6 0s4 6 6 0 3-4 4-2"/>'],
  ['clock','Clock','<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 10v4M11 10v4M14 10.5v.01M14 13.5v.01M17 10v4"/>'],
  ['sched','Schedule','<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
  ['settings','Settings','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'],
];
function navHtml(){ return TABS.filter(([id])=>id!=='clock'||byId('clock')).map(([id,n,p]) => `<button data-tab="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>${n}</button>`).join(''); }
$('#nav').onclick = e => { const b=e.target.closest('button'); if(!b) return; S.tab=b.dataset.tab; S.editing=false; render(); save(); window.scrollTo(0,0); };
$('#skinseg').onclick = e => { const b=e.target.closest('button'); if(!b) return; setSkin(b.dataset.skin); };
function setSkin(k){ S.skin=k; S.editing=false; render(); save(); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2000); }
const sw = (on,id,label,extra='') => `<button class="switch" role="switch" aria-checked="${!!on}" aria-label="${label}" id="${id}" ${extra}></button>`;
const segbar = (id,n) => `<div class="segbar" data-segs="${id}" style="--n:${n}" aria-hidden="true">${'<i></i>'.repeat(n)}</div>`;
// segments the app actually uses on a strip: "Segments in use" (the visible length), or what the strip reports
const segMax = l => TYPES[l.type].segs;
const isSegmented = l => l.type==='rgbic' || l.type==='esp';
const segsOf = l => l.type==='clock' ? 20 : Math.max(1, Math.min(segMax(l), l.segUsed || segMax(l)));

function render(){
  document.body.dataset.skin = S.skin;
  if (S.room!=='all' && !S.rooms.find(r=>r.id===S.room)) S.room='all';
  if (!byId(S.sel)) S.sel = (LIGHTS[0]||{}).id;
  if (S.tab==='clock' && !byId('clock')) S.tab='lights';
  $('#title').textContent = S.skin==='neon' ? 'LIGHT DECK' : 'Light Deck';
  $('#nettext').textContent = netText();
  $$('#skinseg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.skin===S.skin));
  $('#nav').innerHTML = navHtml();
  $$('#nav button').forEach(b => b.dataset.tab===S.tab ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  const v = {lights:viewLights, scenes:viewScenes, modes:viewModes, clock:viewClock, sched:viewSched, settings:viewSettings}[S.tab];
  $('#main').innerHTML = `<section class="view">${v()}</section>`;
  wire[S.tab] && wire[S.tab]();
  collect(); paint(performance.now()/1000); readouts();
}

/* ---------- live painting ---------- */
let paintEls = [];
function collect(){ paintEls = LIGHTS.map(l => ({l, els:$$(`[data-l="${l.id}"]`), stops:$$(`[data-stop="${l.id}"]`), glows:$$(`[data-glow="${l.id}"]`), segs:$$(`[data-segs="${l.id}"]`)})); }
function paint(t){
  paintEls.forEach(({l,els,stops,glows,segs},i) => {
    const [c,lv] = lightAt(l,i,t), cs = c.map(Math.round).join(',');
    els.forEach(e => { e.style.setProperty('--c',cs); e.style.setProperty('--lv',lv.toFixed(3)); });
    stops.forEach(s => { s.setAttribute('stop-color',`rgb(${cs})`); s.setAttribute('stop-opacity',(lv*.95).toFixed(3)); });
    glows.forEach(g => g.setAttribute('r', (18 + 70*lv).toFixed(1)));
    segs.forEach(bar => { const kids=bar.children, n=kids.length;
      for (let k=0;k<n;k++){ const [sc,sl]=lightAt(l,i,t,n>1?k/(n-1):.5); kids[k].style.background = `rgb(${sc.map(v=>Math.round(v*(.1+.9*sl))).join(',')})`; } });
  });
  if (draft) paintDraft(t);
}
function readouts(){
  LIGHTS.forEach(l => {
    $$(`[data-r="${l.id}"]`).forEach(e => e.textContent = l.on ? l.bri+'%' : 'OFF');
    $$(`[data-v="${l.id}"]`).forEach(e => { e.style.setProperty('--v', l.bri/100); e.setAttribute('aria-valuenow', l.bri); });
    $$(`[data-on="${l.id}"]`).forEach(e => e.setAttribute(e.classList.contains('switch')?'aria-checked':'aria-pressed', l.on));
    $$(`[data-bars="${l.id}"]`).forEach(e => [...e.children].forEach((b,k) => b.classList.toggle('on', l.on && k < Math.round(l.bri/5))));
    $$(`input[data-bri="${l.id}"]`).forEach(e => { if (document.activeElement!==e) e.value=l.bri; });
  });
  $$('[data-v="master"]').forEach(e => e.style.setProperty('--v', S.master/100));
  const m=$('#masterr'); if(m) m.textContent=S.master+'%';
}
function changed(){ S.activeScene=null; readouts(); save(); }

function fader(el, get, set){
  const fromY = y => { const r=el.getBoundingClientRect(); return Math.round(Math.max(0,Math.min(1,(r.bottom-14-y)/(r.height-28)))*100); };
  el.onpointerdown = e => { el.setPointerCapture(e.pointerId); el._d=true; set(Math.max(1,fromY(e.clientY))); };
  el.onpointermove = e => { if(el._d) set(Math.max(1,fromY(e.clientY))); };
  el.onpointerup = el.onpointercancel = () => el._d=false;
  el.onkeydown = e => { const d = {ArrowUp:5,ArrowRight:5,ArrowDown:-5,ArrowLeft:-5,PageUp:20,PageDown:-20}[e.key]; if(!d) return; e.preventDefault(); set(Math.max(1,Math.min(100,get()+d))); };
}
function knob(el, getHue, setHue){
  const ang = e => { const r=el.getBoundingClientRect(); return (Math.atan2(e.clientX-(r.left+r.width/2), -(e.clientY-(r.top+r.height/2)))*180/Math.PI+360)%360; };
  el.onpointerdown = e => { el.setPointerCapture(e.pointerId); el._d=true; setHue(ang(e)); };
  el.onpointermove = e => { if(el._d) setHue(ang(e)); };
  el.onpointerup = el.onpointercancel = () => { el._d=false; save(); };
  el.onkeydown = e => { const d={ArrowRight:10,ArrowUp:10,ArrowLeft:-10,ArrowDown:-10}[e.key]; if(!d) return; e.preventDefault(); setHue((getHue()+d+360)%360); };
}
// knobs A/B: live palette of the running mode, otherwise A colors the SEL channels
function setKnob(which, rgb){
  const m = runningMode();
  if (which==='A') S.colorA=rgb; else S.colorB=rgb;
  if (m) { m.pal[which==='A'?0:1] = rgb2hex(rgb); }
  else if (which==='A') { S.armed.filter(byId).forEach(id=>Object.assign(byId(id),{c:rgb.slice(),on:true})); changed(); }
  // knob B + the clock's SEL on = the clock's second color (two-color snake and breathe)
  else if (knobBClock()) { S.clock.c2 = rgb2hex(rgb); S.clock.c2auto = false; save(); }
}
const knobBClock = () => !runningMode() && byId('clock') && S.armed.includes('clock');

/* ===================== LIGHTS ===================== */
function roomBar(){
  return `<div class="roombar" role="group" aria-label="Room">${[{id:'all',name:'All'},...S.rooms].map(r=>`<button class="chip" data-room="${r.id}" aria-pressed="${S.room===r.id}">${r.name} <span class="hint num">${roomLights(r.id).length}</span></button>`).join('')}</div>`;
}

        <span class="nm">Master</span>
      </div>
    </div></div>
    <div class="deckfoot">
      <div class="knobwrap"><button class="knob" id="knobA" aria-label="Color A"><span class="cc" id="ccA" style="background:${css(S.colorA)}"></span><span class="ptr" style="transform:rotate(${hueA}deg)"></span></button><span class="label">Color A</span><span class="knobnote">${m?'Mode color 1':'SEL channels'}</span></div>
      <div class="knobwrap"><button class="knob" id="knobB" aria-label="Color B"><span class="cc" id="ccB" style="background:${css(S.colorB)}"></span><span class="ptr" style="transform:rotate(${hueB}deg)"></span></button><span class="label">Color B</span><span class="knobnote">${m?'Mode color 2':knobBClock()?'Clock 2nd color':'Clock 2nd color when the clock is SEL'}</span></div>
      <div class="pads">${S.presets.slice(0,4).map((p,i)=>`<button class="pad" data-scene="${i}"><span>${i+1}</span><span class="pl" style="background:${sceneGrad(p)}"></span><span style="font-size:11px;font-weight:600">${p.name}</span></button>`).join('')}</div>

/* ---------- room map (one layout per room) ---------- */
const SC = 22;
function mapRoom(){ return S.room==='all' ? (S.rooms[0]||{}).id : S.room; }
function layoutOf(r){ if(!S.layouts[r]) S.layouts[r]={w:12,h:12,items:[{k:'door',x:4.5,y:11.4,w:3,h:.5,r:0}]}; return S.layouts[r]; }
function lightsMap(){
  const rid = mapRoom(); if (!rid) return emptyRoom();
  const R = layoutOf(rid), W=R.w*SC, H=R.h*SC, pad=26, ls = roomLights(rid);
  ls.forEach(l => { if(!S.lampPos[l.id]) S.lampPos[l.id]={x:R.w/2,y:R.h/2}; });
  const furn = R.items.map((it,idx) => {
    const w=(it.r%180?it.h:it.w)*SC, h=(it.r%180?it.w:it.h)*SC, x=it.x*SC, y=it.y*SC;
    let shape = `<rect class="furn" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/>`;
    if (it.k==='door') shape = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#0a1520"/><path class="furn" d="M${x} ${y} A ${w} ${w} 0 0 1 ${x+w} ${y-w} L${x+w} ${y}" style="fill:rgba(124,211,255,.05)"/>`;
    if (it.k==='rug') shape = `<rect class="furn" x="${x}" y="${y}" width="${w}" height="${h}" rx="10" style="stroke-dasharray:2 3"/>`;
    if (it.k==='bed') shape += `<rect class="furn" x="${x+4}" y="${y+4}" width="${w-8}" height="${Math.min(w,h)*.25}" rx="4"/>`;
    return `<g class="item ${S.picked===('f'+idx)?'picked':''}" data-pick-item="f${idx}">${shape}<text class="furn-t" x="${x+w/2}" y="${y+h/2}">${FURN_NAMES[it.k]}</text></g>`;
  }).join('');
  const lamps = ls.map(l => { const p=S.lampPos[l.id], x=p.x*SC, y=p.y*SC;
    const core = l.type==='clock' ? `<rect class="lampcore" x="${x-16}" y="${y-7}" width="32" height="14" rx="3" data-l="${l.id}" style="fill:rgb(var(--c))"/>`
      : l.type==='bulb' ? `<circle class="lampcore" cx="${x}" cy="${y}" r="9" data-l="${l.id}" style="fill:rgba(var(--c),calc(.25 + .75*var(--lv)))"/>`
      : `<rect class="lampcore" x="${x-20}" y="${y-4}" width="40" height="8" rx="4" data-l="${l.id}" style="fill:rgba(var(--c),calc(.25 + .75*var(--lv)))"/>`;
    return `<g class="item ${S.picked===('l:'+l.id)?'picked':''} ${!S.editing&&S.sel===l.id?'focus':''}" data-pick-item="l:${l.id}" data-lamp="${l.id}" tabindex="0" role="button" aria-label="${l.name}">
      <circle data-glow="${l.id}" cx="${x}" cy="${y}" r="40" fill="url(#g-${l.id})" style="pointer-events:none"/>${core}
      <text class="furn-t" x="${x}" y="${y+20}" style="fill:#e3eef5">${short(l.name)}</text></g>`; }).join('');
  const defs = ls.map(l=>`<radialGradient id="g-${l.id}"><stop offset="0" data-stop="${l.id}"/><stop offset="1" stop-opacity="0"/></radialGradient>`).join('');
  const l = byId(S.sel)&&byId(S.sel).room===rid ? byId(S.sel) : ls[0];
  const pickedName = () => { const p=S.picked; if(p==null) return 'nothing'; if(p.startsWith('l:')) return byId(p.slice(2)).name; return FURN_NAMES[R.items[+p.slice(1)].k]; };
  const pf = S.picked && S.picked.startsWith('f');
  return `
  <div class="sec-h"><h2>${roomName(rid)}</h2><span class="hint">${S.room==='all'?'Showing your first room. Pick a room above to see its map. ':''}${S.editing?'Drag anything to move it. Tap an item, then Rotate or Remove.':'Tap a light to adjust it.'}</span></div>
  <div class="mapwrap">
    <div class="blue ${S.editing?'editing':''}">
      <span class="maptag">${R.w} × ${R.h} FT</span>
      <svg id="room" viewBox="${-pad} ${-pad} ${W+pad*2} ${H+pad*2}" role="img" aria-label="${roomName(rid)} layout">
        <defs>${defs}</defs>
        <rect class="wall" x="0" y="0" width="${W}" height="${H}"/>
        <text class="dim" x="${W/2}" y="${-10}">${R.w} ft</text>
        <text class="dim" x="${-12}" y="${H/2}" transform="rotate(-90 ${-12} ${H/2})">${R.h} ft</text>
        ${furn}${lamps}
      </svg>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      ${S.editing ? `
      <div class="card">
        <span class="label">Edit ${roomName(rid)}</span>
        <div class="edit-bar">${Object.keys(FURN_NAMES).map(k=>`<button class="chip" data-add="${k}">+ ${FURN_NAMES[k]}</button>`).join('')}</div>
        <div class="row"><span>Selected: <b>${pickedName()}</b></span>
          <span class="chips"><button class="btn small" id="rot" ${pf?'':'disabled'}>Rotate</button><button class="btn small" id="del" ${pf?'':'disabled'}>Remove</button></span></div>
        <div class="row"><span>Room width</span><span class="chips"><button class="btn small" data-rs="w,-1" aria-label="Narrower">−</button><b class="num">${R.w} ft</b><button class="btn small" data-rs="w,1" aria-label="Wider">+</button></span></div>
        <div class="row"><span>Room length</span><span class="chips"><button class="btn small" data-rs="h,-1" aria-label="Shorter">−</button><b class="num">${R.h} ft</b><button class="btn small" data-rs="h,1" aria-label="Longer">+</button></span></div>
        <div class="row"><button class="btn" id="resetroom">Clear furniture</button><button class="btn primary" id="doneedit">Save layout</button></div>
      </div>` : l ? `
      <div class="card ledit">
        <div class="row"><div><div class="label">${l.wizScene ? 'WiZ scene: '+wizSceneInfo(l.wizScene).n : TYPES[l.type].label}</div><div class="bigname">${l.name}</div></div>${sw(l.on,'lon',l.name+' on/off',`data-on="${l.id}" data-toggle="${l.id}"`)}</div>
        ${isGrad(l)&&l.type!=='clock'?segbar(l.id,segsOf(l)):''}
        <div class="row"><span>Brightness</span><b class="num" data-r="${l.id}"></b></div>
        <input type="range" min="1" max="100" data-bri="${l.id}" aria-label="${l.name} brightness">
        <div class="row"><span>Color</span><button class="swbtn" data-l="${l.id}" data-color="${l.id}" style="background:rgb(var(--c))" aria-label="Pick ${l.name} color"></button></div>
        <div class="chips">${ls.map(x=>`<button class="chip" data-pick="${x.id}" aria-pressed="${x.id===l.id}"><span class="sw" data-l="${x.id}" style="background:rgb(var(--c))"></span>${short(x.name)}</button>`).join('')}</div>
      </div>
      <button class="btn" id="startedit">Edit ${roomName(rid)} layout</button>` : `<div class="card"><span class="hint">No lights here yet.</span><button class="btn" id="startedit">Edit layout</button></div>`}
    </div>
  </div>`;
}

/* ===================== SCENES ===================== */
function sceneGrad(p){
  const cs=LIGHTS.filter(l=>p.L[l.id]).flatMap(l=>{const v=p.L[l.id]; if(!v[0]) return ['#222']; const mid=sceneLightMode(p,v); if(mid) return modeById(mid).pal.map(h=>css(hex2rgb(h),.35+.65*v[1]/100)); return [css(v[2],.35+.65*v[1]/100)];}); if(cs.length<2) cs.push(cs[0]||'#222'); return `linear-gradient(90deg,${cs.join(',')})`; }
function viewScenes(){
  return `

        ${(()=>{ const ms=[...new Set(Object.values(p.L).map(v=>sceneLightMode(p,v)).filter(Boolean))]; return ms.length?`<span class="hint">▶ ${ms.map(id=>modeById(id).name).join(', ')}</span>`:''; })()}
        <span class="hint">${LIGHTS.filter(l=>p.L[l.id]).length} lights · ${LIGHTS.filter(l=>p.L[l.id]?.[0]).length} on</span>
      </button>
      ${S.sceneMenu===i?`<div class="smenu">
        <input type="text" value="${p.name.replace(/"/g,'&quot;')}" data-srename="${i}" maxlength="20" aria-label="Scene name">
        <div class="chips"><button class="btn small primary" data-sedit="${i}">Edit lights</button><button class="btn small" data-over="${i}">Update to now</button><button class="btn small danger" data-delscene="${i}">Delete</button><button class="btn small" data-smore="${i}">Done</button></div>
      </div>`:`<button class="smore" data-smore="${i}" aria-label="More options for ${p.name}">⋯</button>`}
    </div>`).join('')}</div>
  <div class="card">
    <span class="label">Save what's on now · ${roomName(S.room)}</span>

    <div class="row" style="margin-top:6px">${d.i==null?'<span></span>':`<button class="btn danger" id="sdel">Delete scene</button>`}<span class="chips"><button class="btn" id="stry">Try it</button><button class="btn primary" id="ssave">Save</button></span></div>
  </div></div>`;

  $('#sall').onclick=()=>{ LIGHTS.forEach(l=>{ if(!d.L[l.id]) d.L[l.id]=fresh(l); }); renderSceneEditor(); };

    if (v[3]) { v[3]=0; b.style.background=css(v[2]); }

  $('#stry').onclick=()=>{ applySceneData(d); S.activeScene=null; save(); render(); toast('Showing this scene. Not saved yet.'); };
  $('#ssave').onclick=()=>{

    const nm=S.presets[d.i].name; S.presets.splice(d.i,1); S.activeScene=null; sdraft=null; E.innerHTML=''; save(); render(); toast(`Deleted ${nm}`);
  };
}

/* ===================== CLOCK (LED-accurate, mirrors led_clock_sinric.ino) ===================== */
const CFX=[['solid','Solid'],['snake','Snake'],['breathe','Breathe'],['breathe2','Two-color breathe'],['snake2','Two-color snake'],['rainbow','Rainbow'],['fire','Fire'],['music','Music']];
const DW=60, DH=110, DGAP=20, CLW=24;
const CORNER={TL:[0,0],TR:[1,0],ML:[0,.5],MR:[1,.5],BL:[0,1],BR:[1,1]};
const SEG_ENDS={a:['TL','TR'],b:['TR','MR'],c:['MR','BR'],d:['BL','BR'],e:['ML','BL'],f:['TL','ML'],g:['ML','MR']};
const STROKE_STR=['aTL bTR cMR dBR eBL fML','bTR cMR','aTL bTR gMR eML dBL','aTL bTR gMR cMR dBR','fTL gML bTR cMR',
  'aTR fTL gML cMR dBR','aTR fTL eML dBL cBR gMR','aTL bTR cMR','fML aTL bTR gMR eML dBL cBR','gMR fML aTL bTR cMR dBR','gML'];
const STROKES=STROKE_STR.map(s=>s.split(' ').map(x=>[x[0],x.slice(1)]));
const DIGIT_X=[0, DW+DGAP, 2*DW+3*DGAP+CLW, 3*DW+4*DGAP+CLW], COLON_X=2*DW+2*DGAP+CLW/2, CLOCK_W=4*DW+4*DGAP+CLW;
function segLeds(ox, seg, from){ const [e1,e2]=SEG_ENDS[seg], to=from===e1?e2:e1, A=CORNER[from], B=CORNER[to], out=[];
  for(let i=0;i<5;i++){ const f=.14+.72*(i+.5)/5; out.push([ox+(A[0]+(B[0]-A[0])*f)*DW, (A[1]+(B[1]-A[1])*f)*DH]); } return out; }
const GHOSTS=[]; DIGIT_X.forEach(ox=>Object.keys(SEG_ENDS).forEach(s=>GHOSTS.push(...segLeds(ox,s,SEG_ENDS[s][0])))); GHOSTS.push([COLON_X,DH*.3],[COLON_X,DH*.7]);
const sin8=x=>128+127*Math.sin(x/256*2*Math.PI);
function clockChars(){
  const n=new Date(), left=S.sched.sleepEnd-Date.now();
  if (S.clock.alarmFx && left>0) { const m=Math.floor(left/60000), s=Math.floor(left/1000)%60; return {ch:(String(m).padStart(2,'0')+String(s).padStart(2,'0')).split(''), colon:true, timer:true}; }
  let h=n.getHours(); if(!S.clock.h24) h=h%12||12;
  const hs=String(h).padStart(2,'0'), ms=String(n.getMinutes()).padStart(2,'0'), ch=[hs[0],hs[1],ms[0],ms[1]];
  if(ch[0]==='0' && !S.clock.lead) ch[0]=' ';
  return {ch, colon:!S.clock.blink || n.getSeconds()%2===0};
}
function clockPath(){ const {ch,colon,timer}=clockChars(), path=[];
  ch.forEach((c,d)=>{ if(c!==' ') STROKES[+c].forEach(([s,f])=>segLeds(DIGIT_X[d],s,f).forEach(p=>path.push({p,d,lit:true})));
    if(d===1){ path.push({p:[COLON_X,DH*.3],d:'c',lit:colon}); path.push({p:[COLON_X,DH*.7],d:'c',lit:colon}); } });
  return {path,timer}; }
function clockLed(k,n,ms,base,second){
  const C=S.clock, t=ms*C.speed/64, f=C.fx;
  if(f==='snake'){ const len=30, head=Math.floor(t/15)%n, dist=(head+n-k)%n; return [base,(dist<len?255-dist*200/len:45)/255]; }
  if(f==='snake2'){ const len=30, head=Math.floor(t/15)%n, dist=(head+n-k)%n; if(dist>=len) return [second,1]; return [mix(second,base,1-dist/len),1]; }
  if(f==='breathe') return [base,(70+sin8(t/12)*185/255)/255];
  if(f==='breathe2'){ const p=t/12, pulse=Math.floor((p+64)/256); return [pulse&1?second:base,(15+sin8(p)*240/255)/255]; }
  if(f==='rainbow') return [hsv((k/n*360 + t/30)%360),1];
  if(f==='fire'){ const z=noise(ms/1000*3.2*C.speed/128 + k*1.9); return [hsv(4+26*(.5+.5*z)),.35+.65*(.5+.5*z)]; }
  if(f==='music') return [musicColor(Math.floor(k/n*S.musicPal.length)),.15+.85*beat.env];
  return [base,1];
}
function drawClock(ms){
  const cv=$('#clockcv'), cl=byId('clock'); if(!cv||!cl) return;
  const dpr=window.devicePixelRatio||1, cssW=cv.clientWidth||420, pad=14, sc=cssW/(CLOCK_W+pad*2), cssH=(DH+pad*2)*sc;
  if(cv.width!==Math.round(cssW*dpr)){ cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr); cv.style.height=cssH+'px'; }
  const g=cv.getContext('2d'); g.setTransform(dpr*sc,0,0,dpr*sc,pad*dpr*sc,pad*dpr*sc); g.clearRect(-pad,-pad,CLOCK_W+pad*2,DH+pad*2);
  const L=7; g.shadowBlur=0; g.fillStyle='rgba(255,255,255,.055)';
  GHOSTS.forEach(([x,y])=>{ g.beginPath(); g.roundRect?g.roundRect(x-L/2,y-L/2,L,L,2):g.rect(x-L/2,y-L/2,L,L); g.fill(); });
  if(!cl.on) return;
  const bri=Math.sqrt((cl.bri/100)*(S.master/100)), {path,timer}=clockPath(), n=path.length, m=modeOfLight('clock'), useMode=!!m, second=clockSecond();
  path.forEach((led,k)=>{
    if(!led.lit) return;
    const base = hex2rgb(led.d==='c'?S.clock.colon:S.clock.dc[led.d]);       // the countdown uses the clock's colors too
    let [c,v] = useMode ? gradColor(m,k/(n-1),ms/1000,0) : clockLed(k,n,ms,base,second); v*=bri;
    g.shadowBlur=14*v; g.shadowColor=`rgba(${c.map(Math.round).join(',')},.9)`; g.fillStyle=`rgb(${c.map(x=>Math.round(x*v)).join(',')})`;
    const [x,y]=led.p; g.beginPath(); g.roundRect?g.roundRect(x-L/2,y-L/2,L,L,2):g.rect(x-L/2,y-L/2,L,L); g.fill();
  });
}

const sceneLightMode = (p,v) => { const mid = typeof v[3]==='string' ? v[3] : (v[3] && p.mode) ? p.mode : null; return mid && modeById(mid) ? mid : null; };

  const rm=runningMode(); if (rm) { S.colorA=hex2rgb(rm.pal[0]); S.colorB=hex2rgb(rm.pal[1]||rm.pal[0]); }

/* ---------- drag to reorder ----------
   Mouse: press and move. Touch: hold ~0.3 s, then drag (a quick swipe still scrolls).
   With a handle selector, dragging starts immediately from the handle. */
let dragActive=false, suppressClick=false;
document.addEventListener('touchmove', e => { if (dragActive) e.preventDefault(); }, {passive:false});
document.addEventListener('contextmenu', e => { if (dragActive || e.target.closest('[data-sort]')) e.preventDefault(); });
function sortable(container, onDrop, handleSel){
  if (!container) return;
  container.addEventListener('pointerdown', e => {
    const item = e.target.closest('[data-sort]'); if (!item || item.parentElement!==container) return;
    const onHandle = handleSel && e.target.closest(handleSel);
    if (handleSel && !onHandle) return;
    if (e.target.closest('input,select,.smore,.smenu,.fader,.knob')) return;
    const touch = e.pointerType!=='mouse', sx=e.clientX, sy=e.clientY;
    let started=false, timer=null, ghost=null, offX=0, offY=0;
    const start = () => {
      started=true; dragActive=true;
      const r=item.getBoundingClientRect(); offX=sx-r.left; offY=sy-r.top;
      ghost=item.cloneNode(true); ghost.classList.add('drag-ghost');
      Object.assign(ghost.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
      document.body.appendChild(ghost); item.classList.add('drag-src');
      try { navigator.vibrate && navigator.vibrate(12); } catch(_) {}
    };
    if (touch && !onHandle) timer=setTimeout(start, 300);
    const move = ev => {
      if (!started) {
        if (Math.hypot(ev.clientX-sx, ev.clientY-sy) > 8) { if (touch && !onHandle) { end(); return; } start(); } else return;
      }
      ghost.style.left=(ev.clientX-offX)+'px'; ghost.style.top=(ev.clientY-offY)+'px';
      const under=document.elementFromPoint(ev.clientX, ev.clientY), over=under && under.closest('[data-sort]');
      if (over && over!==item && over.parentElement===container) {
        const items=[...container.querySelectorAll(':scope > [data-sort]')], a=items.indexOf(item), b=items.indexOf(over);
        container.insertBefore(item, a<b ? over.nextSibling : over);
      }
      const sc=container.closest('.stripscroll'); if (sc) { const r=sc.getBoundingClientRect(); if (ev.clientX>r.right-30) sc.scrollLeft+=8; if (ev.clientX<r.left+30) sc.scrollLeft-=8; }
    };
    const end = (drop) => {
      clearTimeout(timer); window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',cancel);
      if (started) {
        ghost.remove(); item.classList.remove('drag-src'); dragActive=false;
        suppressClick=true; setTimeout(()=>suppressClick=false, 60);
        if (drop) onDrop([...container.querySelectorAll(':scope > [data-sort]')].map(x=>x.dataset.key));
        else render();
      }
    };
    const up = () => end(true), cancel = () => end(false);
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',cancel);
  });
}
// put the given light ids, in this order, into the slots those lights already occupy in LIGHTS
function reorderLights(ids){
  const slots = ids.map(id=>LIGHTS.findIndex(l=>l.id===id)).sort((a,b)=>a-b), picked = ids.map(byId);
  slots.forEach((s,j)=>LIGHTS[s]=picked[j]); save(); render();
}

function wireMap(){
  const svg=$('#room'); if(!svg) return;
  if(!S.editing){ const se=$('#startedit'); if(se) se.onclick=()=>{ S.editing=true; S.picked=null; render(); }; return; }
  const R=layoutOf(mapRoom());
  const pt = e => { const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  const posOf = key => key.startsWith('l:') ? S.lampPos[key.slice(2)] : R.items[+key.slice(1)];
  let drag=null;
  svg.onpointerdown = e => {
    const g=e.target.closest('.item'); if(!g){ S.picked=null; render(); return; }
    const key=g.dataset.pickItem, it=posOf(key), p=pt(e);
    S.picked=key; drag={it, dx:p.x/SC-it.x, dy:p.y/SC-it.y, bx:it.x, by:it.y, g}; svg.setPointerCapture(e.pointerId);
    svg.querySelectorAll('.item').forEach(x=>x.classList.toggle('picked',x===g));
  };
  svg.onpointermove = e => { if(!drag) return; const it=drag.it, p=pt(e);
    it.x=Math.max(-1,Math.min(R.w,Math.round((p.x/SC-drag.dx)*4)/4)); it.y=Math.max(-1,Math.min(R.h,Math.round((p.y/SC-drag.dy)*4)/4));
    drag.g.setAttribute('transform',`translate(${(it.x-drag.bx)*SC},${(it.y-drag.by)*SC})`); drag.moved=true; };
  svg.onpointerup = svg.onpointercancel = () => { if(drag) render(); drag=null; };
  $('#rot').onclick=()=>{ const it=S.picked&&S.picked.startsWith('f')&&R.items[+S.picked.slice(1)]; if(it){ it.r=(it.r+90)%360; render(); } };
  $('#del').onclick=()=>{ if(S.picked&&S.picked.startsWith('f')){ R.items.splice(+S.picked.slice(1),1); S.picked=null; render(); } };
  $('#resetroom').onclick=()=>{ R.items=R.items.filter(i=>i.k==='door'); S.picked=null; render(); toast('Furniture cleared'); };
  $('#doneedit').onclick=()=>{ S.editing=false; S.picked=null; save(); render(); toast('Layout saved on the hub'); };
}

const SWATCHES=['ff3c00','ffa000','ff1a1a','ff2e88','8a2bff','1e5bff','00c8ff','00e05a','ffb46a','e8eeff'];

    <div class="pv" id="shpv"></div>

    <div class="row"><label class="label" for="shk">Whites</label><span class="hint num" id="shkv">Warm yellow to white</span></div>
    <input class="hue kel" type="range" id="shk" min="2200" max="6500" step="50" value="2700" aria-label="White temperature, warm yellow to white">

  </div></div>`;
  const pv=$('#shpv'), H=$('#shh'), Sx=$('#shs');
  const upd=c=>{ pv.style.background=css(c); Sx.style.background=`linear-gradient(90deg,#fff,${css(hsv(+H.value))})`; onPick(c.map(Math.round)); };
  H.oninput=Sx.oninput=()=>upd(hsv(+H.value,+Sx.value/100)); pv.style.background=css(rgb); Sx.style.background=`linear-gradient(90deg,#fff,${css(hsv(h))})`;
  const K=$('#shk'); K.oninput=()=>{ const c=kelvinSmooth(+K.value), [hh,ss]=toHS(c); H.value=Math.round(hh); Sx.value=Math.round(ss*100); $('#shkv').textContent=K.value+' K'; upd(c); };
  root.querySelectorAll('[data-swx]').forEach(b=>b.onclick=()=>{ const c=hex2rgb(b.dataset.swx), [hh,ss]=toHS(c); H.value=Math.round(hh); Sx.value=Math.round(ss*100); upd(c); });
  const close=()=>{ root.innerHTML=''; save(); if(onClose) onClose(); else render(); document.removeEventListener('keydown',esc); };
  const esc=e=>{ if(e.key==='Escape') close(); };

}

function openDigit(d){
  const C=S.clock, isColon=d==='c', cur=hex2rgb(isColon?C.colon:C.dc[+d]);
  const label=isColon?'Colon color':(+d<2?'Hours color':'Minutes color');

/* ===================== animation loop ===================== */
function tick(ms){
  const t=ms/1000;
  if (S.fx==='music' || S.clock.fx==='music') {
    const period=.5, ph=(t%period)/period;
    if (!MIC.stream && t-beat.last>=period) { beat.last=t-(t%period); beat.idx++; }
    // preview: the mic's loudness when listening, otherwise a smooth breath (no flashing)
    beat.env = MIC.stream ? (MIC.loud||0) : .35+.65*(.5+.5*Math.cos(2*Math.PI*ph));
    const m=$('#meter'); if(m) [...m.children].forEach((b,i)=>{ b.style.height=(Math.max(.04,beat.env*(.4+.6*Math.abs(Math.sin(i*1.3+t*6))))*100)+'%'; });
  }
  paint(t);
  if (S.tab==='modes') paintModeCards(t);
  if (S.tab==='clock') drawClock(ms);
  if (S.tab==='sched') { const e=$('#sleepleft'), left=S.sched.sleepEnd-Date.now(); if(e) e.textContent = left>0?fmtLeft(left):''; }
  requestAnimationFrame(tick);
}
/* ===================== count my segments =====================
   Lights segments 1..n one at a time (alternating red/blue, the rest dark) so you can see where the
   visible end of the strip is, then saves n as "Segments in use".
   Real hub: each step sends the strip n width-1 steps via the WiZ elm payload (up to 12 per message;
   past 12 the hub doubles widths). Demo: only the bar below lights up. */
function openCounter(id){
  const l=byId(id), max=segMax(l); let n=1, playing=true, timer=null;
  const E=$('#editorRoot');
  E.innerHTML=`<div class="backdrop" id="cbd"><div class="sheet" role="dialog" aria-modal="true" aria-label="Count segments">
    <div class="row"><b class="bigname" style="font-size:22px">Count segments: ${l.name}</b><button class="btn small" id="ccancel">Cancel</button></div>
    <span class="hint">Watch your strip. Segments light up one at a time, alternating red and blue, and the rest stay dark. When the newest one is at the visible end of the strip, tap <b>That's the last one</b>.</span>
    <div style="text-align:center"><div class="label">Segment</div><div class="num" style="font-size:56px;font-weight:600;line-height:1.1" id="cn" aria-live="polite">1</div><div class="hint">of up to ${max}</div></div>
    <div class="segbar" id="cbar" style="--n:${max};height:22px" aria-hidden="true">${'<i></i>'.repeat(max)}</div>
    <div class="row" style="justify-content:center"><button class="btn" id="cback" aria-label="Previous segment">◀ Back</button><button class="btn" id="cplay">Pause</button><button class="btn" id="cnext" aria-label="Next segment">Next ▶</button></div>
    <button class="btn primary" id="cdone">That's the last one</button>
    <span class="demo" style="align-self:flex-start">demo: only this bar lights up</span>
    ${HUB.live?'<span class="hint">Your real strip is lighting up along with this bar.</span>':''}
  </div></div>`;
  // live: light the real strip the same way (segments 1..n alternating red/blue, the rest dark; max 12 blocks)
  const sendReal=()=>{ if (!HUB.live) return;
    const steps=[], first=Math.max(1,n-11);
    steps.push([255,42,42,first]);
    for (let k=first;k<n;k++) steps.push(k%2?[30,91,255,1]:[255,42,42,1]);
    hubApi('/api/segments',{id:l.id, steps, bri:100}).catch(()=>{}); };
  const draw=()=>{ $('#cn').textContent=n; [...$('#cbar').children].forEach((s,k)=>{ s.style.background = k<n ? (k%2?'#1e5bff':'#ff2a2a') : '#111'; s.style.outline = k===n-1 ? '2px solid #fff' : 'none'; s.style.outlineOffset='-2px'; }); sendReal(); };
  const close=()=>{ clearInterval(timer); E.innerHTML=''; if (HUB.live) { HUB.touched[l.id]=0; HUB.lastSent[l.id]={}; } };   // live: put the strip back to its color
  timer=setInterval(()=>{ if(playing && n<max){ n++; draw(); } if(n>=max){ playing=false; $('#cplay').textContent='Play'; } }, 1300);
  $('#cplay').onclick=()=>{ playing=!playing; if(playing && n>=max) n=1; $('#cplay').textContent=playing?'Pause':'Play'; draw(); };
  $('#cback').onclick=()=>{ playing=false; $('#cplay').textContent='Play'; n=Math.max(1,n-1); draw(); };
  $('#cnext').onclick=()=>{ playing=false; $('#cplay').textContent='Play'; n=Math.min(max,n+1); draw(); };
  $('#cdone').onclick=()=>{ l.segUsed=n; close(); save(); render(); toast(`${l.name}: ${n} segments in use`); };
  $('#ccancel').onclick=close; $('#cbd').onclick=e=>{ if(e.target.id==='cbd') close(); };
  draw();
}

/* ===================== hub connection =====================
   Served by the Light Deck hub  -> live: sign in, load/save the shared data on the hub, poll the lights'
                                    real state once a second, and send changes as they happen.
   Opened anywhere else (the artifact link) -> demo: simulated lights, everything in this browser.
   The rest of the app doesn't care which: it changes LIGHTS/S, and hubSync() sends whatever differs
   from what the lights last got. */
var HUB = { live:false, token:'', status:null, cfg:null, devices:null, online:{}, offline:false,
              saveT:0, lastSaved:'', lastSent:{}, touched:{}, synced:{}, clkSent:'', sleepSent:0, timers:[] };
const SHARED_KEYS = ['rooms','layouts','lampPos','presets','modes','clock','sched','musicPal','colorA','colorB','speed','sens',
                     'fxTargets','master','armed','lightModes','lastMode','fx','bpm','onlineUrl'];

/* ---------- away from home: the online copy talks to the hub through the EMQX relay ----------
   Every message is AES-256-GCM encrypted with key = SHA-256("lightdeck-remote|" + passwordHash), where
   passwordHash = SHA-256(hub's salt + your password), the same hash the hub stores. The relay login
   (from the hub's "Set up a device" link) only lets this device reach the relay; without the password
   nothing can be read or sent. */
const RM = { cfg:null, cli:null, cid:'', key:null, salt:null, helloRes:null, pending:new Map() };
const rhex = n => [...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join('');
function b64(u8){ let s=''; for (let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ const bin=atob(s); const u=new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
async function sha256hex(s){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function remoteCfg(){ try { return JSON.parse(LS.get('ld-remote')||'null'); } catch(e) { return null; } }
async function remoteConnect(){
  if (RM.cli) return;
  if (!window.mqtt) { try { await loadScript('https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js'); } catch(e) { await loadScript('https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js'); } }
  const c = RM.cfg; RM.cid = 'ldapp-'+rhex(6);
  RM.cli = mqtt.connect(`wss://${c.h}:${c.w||8084}/mqtt`, {username:c.u, password:c.p, clientId:RM.cid, clean:true, reconnectPeriod:3000, connectTimeout:10000});
  RM.cli.on('connect', ()=>{ RM.cli.subscribe([`ld/${c.id}/hello`, `ld/${c.id}/res/${RM.cid}`], {qos:1}); HUB.offline=false; });
  RM.cli.on('offline', ()=>{ HUB.offline=true; });
  RM.cli.on('message', async (topic, payload)=>{
    const s = new TextDecoder().decode(payload);
    if (topic.endsWith('/hello')) { try { const j=JSON.parse(s); RM.salt=j.salt; if (RM.helloRes) RM.helloRes(j); } catch(e) {} return; }
    if (!RM.key) return;
    try { const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(s).slice(0,12)}, RM.key, unb64(s).slice(12));
          const r = JSON.parse(new TextDecoder().decode(pt)), done = RM.pending.get(r.id);
          if (done) { RM.pending.delete(r.id); done(r); } } catch(e) {}
  });
}
function remoteSalt(){
  if (RM.salt!=null) return Promise.resolve(RM.salt);
  return new Promise((res,rej)=>{ RM.helloRes=j=>res(j.salt); setTimeout(()=>rej({error:'The hub isn\'t connected to the relay. Check that it\'s powered and remote access is on.'}), 12000); });
}
async function remoteKeyFromPassword(pw){
  const salt = await remoteSalt(); if (!salt) throw {error:'The hub has no password set yet'};
  const ph = await sha256hex(salt+pw);
  return new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('lightdeck-remote|'+ph)));
}
const importAesKey = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']);
function remoteRequest(path, method, body){
  return new Promise(async (res,rej)=>{
    if (!RM.cli || !RM.key) return rej({error:'Not connected to the relay'});
    const id = rhex(8);
    const t = setTimeout(()=>{ RM.pending.delete(id); rej({error:'No answer from the hub', timeout:true}); }, 9000);
    RM.pending.set(id, r=>{ clearTimeout(t); res(r); });
    const msg = JSON.stringify({id, c:RM.cid, p:path, m:method, t:Date.now(), b: body===undefined?'':(typeof body==='string'?body:JSON.stringify(body))});
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, RM.key, new TextEncoder().encode(msg)));
    const out = new Uint8Array(12+ct.length); out.set(iv); out.set(ct,12);
    RM.cli.publish(`ld/${RM.cfg.id}/req`, b64(out), {qos:0});
  });
}
async function showLockRemote(){
  const L=$('#lock');
  if (!RM.cfg) {
    L.innerHTML = `<form novalidate><div class="lk"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
      <h1>Light Deck</h1><span class="hint">This phone or laptop isn't set up for away from home yet. At home, open the hub's app, go to <b>Settings → Away from home</b>, tap <b>Set up a device</b>, and open that link here.</span></form>`;
    L.hidden=false; return;
  }
  L.innerHTML = `<form id="lockform" novalidate>
    <div class="lk"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1>Light Deck</h1>
    <span class="hint">Away from home. Enter your app password to reach your lights through the relay. It's asked once on this device.</span>
    ${pwField('lp1','Password','current-password')}
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn primary" type="submit">Sign in</button>
    <span class="hint">Your password never leaves this device: it's turned into the key that encrypts every message to the hub.</span>
  </form>`;
  L.hidden=false;
  L.querySelectorAll('[data-peek]').forEach(b=>b.onclick=()=>{ const i=$('#'+b.dataset.peek); i.type=i.type==='password'?'text':'password'; b.textContent=i.type==='password'?'Show':'Hide'; });
  $('#lp1').focus();

    e.preventDefault(); const err=$('#lerr'); err.textContent='Connecting…';
    try {
      await remoteConnect();

      HUB.status = await hubApi('/api/status');
      LS.set('ld-rkey', b64(raw));
      await hubLoad();
      L.hidden=true; L.innerHTML=''; boot(); toast('Signed in. Away from home.');
    } catch(x) { RM.key=null; err.textContent = x&&x.timeout ? 'That password isn\'t right, or the hub is offline.' : (x&&x.error) || 'Couldn\'t connect to the relay.'; }
  };
}
const DEVICE_KEYS = ['skin','tab','room','sel','musicSrc'];

async function hubApi(path, body){
  const post = body!==undefined;
  if (HUB.remote) {                       // away from home: the same request, encrypted, through the relay
    const r = await remoteRequest(path, post?'POST':'GET', body);
    let j = {}; try { j = JSON.parse(r.b||'{}'); } catch(e) {}
    if (r.s >= 400) throw j;
    return j;
  }
  const r = await fetch(path, { method: post?'POST':'GET', cache:'no-store',
    headers: Object.assign({'X-Token':HUB.token}, post?{'Content-Type':'application/json'}:{}),
    body: post ? (typeof body==='string'?body:JSON.stringify(body)) : undefined });
  let j = {}; try { j = await r.json(); } catch(e) {}
  if (r.status===401 && path!=='/api/login' && path!=='/api/setup') { hubSignedOut(); throw j; }
  if (!r.ok) throw j;
  return j;
}
async function detectHub(){
  try { const r = await fetch('/api/status', {cache:'no-store'}); if (!r.ok) return false;
        const j = await r.json(); if (j.name!=='Light Deck hub') return false; HUB.status=j; return true; }
  catch(e) { return false; }
}
function hubSignedOut(){ HUB.token=''; LS.del('ld_token'); if (HUB.remote) { LS.del('ld-rkey'); RM.key=null; } HUB.timers.forEach(clearInterval); HUB.timers=[]; booted=false; showLock(); }
function lightStatic(l){ const o={id:l.id, name:l.name, room:l.room, type:l.type, ip:l.ip, mac:l.mac}; if (l.segUsed) o.segUsed=l.segUsed; if (l.white) o.white=l.white; return o; }
function hubConfig(){
  const app={}; SHARED_KEYS.forEach(k=>{ if (S[k]!==undefined) app[k]=S[k]; });
  return {v:1, segSlot:(HUB.cfg&&HUB.cfg.segSlot)||258, rooms:S.rooms, lights:LIGHTS.map(lightStatic), app};
}
function hubSaveDevice(){ const d={}; DEVICE_KEYS.forEach(k=>d[k]=S[k]); LS.set('ld-device', JSON.stringify(d)); }
function hubScheduleSave(){
  clearTimeout(HUB.saveT);
  HUB.saveT = setTimeout(()=>{
    const body = JSON.stringify(hubConfig());
    if (body===HUB.lastSaved) return;                       // nothing shared changed (e.g. a fader drag)
    hubApi('/api/config', body).then(()=>{ HUB.lastSaved=body; })
      .catch(e=>toast('Couldn\'t save to the hub: '+((e&&e.error)||'no connection')));
  }, 700);
}
async function hubLoad(){
  const cfg = await hubApi('/api/config'); HUB.cfg = cfg;
  if (cfg.app) SHARED_KEYS.forEach(k=>{ if (cfg.app[k]!==undefined) S[k]=cfg.app[k]; });
  if (Array.isArray(cfg.rooms) && cfg.rooms.length) S.rooms = cfg.rooms;
  const prev = LIGHTS;
  LIGHTS = (cfg.lights||[]).map(o=>{ const old=prev.find(x=>x.id===o.id);
    return Object.assign({on:false, bri:50, c:[255,170,90]}, old?{on:old.on, bri:old.bri, c:old.c}:{}, o); });
  try { const d=JSON.parse(LS.get('ld-device')||'null'); if (d) DEVICE_KEYS.forEach(k=>{ if (d[k]!==undefined) S[k]=d[k]; }); } catch(e) {}
  S.deskSegsMeasured = true;
  if (!S.fxTargets) S.fxTargets = LIGHTS.map(l=>l.id);
  if (!S.lightModes) S.lightModes = {};
  HUB.synced={}; HUB.lastSent={}; HUB.clkSent=''; HUB.lastSaved = JSON.stringify(hubConfig());
}
// what a light should be showing (brightness includes the Mixer's master fader)
function desiredOf(l){ return {on:!!l.on, bri:Math.max(1, Math.min(100, Math.round(l.bri*S.master/100))), c:l.c.map(v=>Math.round(v))}; }
// signed in: at home with a token, or away from home with the relay key
const hubReady = () => HUB.live && (HUB.remote ? !!RM.key : !!HUB.token);
async function hubPoll(){
  if (!hubReady()) return;
  try {
    const st = await hubApi('/api/state'), now = Date.now();
    let sceneChanged = false;
    HUB.offline = false;
    st.lights.forEach(s=>{
      const l = byId(s.id); if (!l) return;
      HUB.online[s.id] = s;
      if (s.ago < 0) return;                                            // not heard from yet
      if (now - (HUB.touched[s.id]||0) < 2500) return;                  // you just changed it: don't jump back
      l.on = !!s.on;
      if (s.bri) l.bri = Math.max(1, Math.min(100, Math.round(s.bri*100/Math.max(1,S.master))));
      const hasRgb = s.c && (s.c[0]||s.c[1]||s.c[2]);
      if (l.type!=='clock' && !s.scene && s.temp>0) l.c = kelvinSmooth(s.temp);   // a white (from the remote, WiZ app or night warm)
      else if (hasRgb && (l.type==='clock' || !s.scene)) l.c = s.c.slice();
      // a WiZ scene (not our own per-segment slot): show it, and let it take over from any app mode on this lamp
      const segSlot = (HUB.cfg&&HUB.cfg.segSlot)||258;
      const wiz = l.type!=='clock' && s.scene>0 && s.scene!==segSlot ? s.scene : 0;

const CLOCK_FX_NAMES=['solid','snake','breathe','breathe2','snake2','rainbow','fire','music','dynamic'];

// A quick effect that includes the clock -> the clock's own matching animation (it animates itself)

// Send whatever differs from what each light last got (runs 6-7 times a second)
function hubSync(){

    if (!HUB.synced[l.id]) return;

    if (d.on!==p.on) patch.on=d.on;
    if (d.on && d.bri!==p.bri) patch.bri=d.bri;

    if (d.on && cChanged) { patch.c=d.c; l.wizScene=0; }     // picking a color takes the lamp out of a WiZ scene
    if (!Object.keys(patch).length) return;

// Phone-mic beat detection for Music sync. Browsers only allow the mic on HTTPS pages (and localhost),
// so this runs on the online copy of the app; on the hub's own http:// page the hub keeps its own tempo.
// Phones only let a page start the mic and audio processing right after a tap, so micStart() runs from
// the Music sync tile or the Start listening button. micUpdate() (every second) only stops it when it's
// no longer wanted, and restarts it by itself if this site already has mic permission.
// Sound sources: 'phone' = this device's microphone; 'pc' = the sound playing on this laptop (Spotify app
// or web player), captured with screen-share audio (Chrome/Edge on a computer; phones can't do this);
// 'panel' = the future INMP441 mic on the panel.
const MIC = { stream:null, ctx:null, an:null, buf:null, avg:0, last:0, timer:0, beats:0, status:'', src:'' };
function pcAudioSupported(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) && !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent); }
function micAllowedHere(){ return HUB.live && window.isSecureContext && !!(navigator.mediaDevices && (S.musicSrc==='pc' ? pcAudioSupported() : navigator.mediaDevices.getUserMedia)); }
